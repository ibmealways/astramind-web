services:
  - type: web
    name: aigenikz-intelligence-os-staging
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: AIGENIKZ_AUTH_DB_PATH
        value: /opt/render/project/src/storage/aigenikz-auth.db
      - key: AIGENIKZ_PLATFORM_DB_PATH
        value: /opt/render/project/src/storage/aigenikz-platform.db
      - key: AIGENIKZ_VIDEO_MODE
        value: local-test
      - key: VIDEO_RENDER_PROFILE
        value: staging-low-memory
      - key: ALLOW_TOKEN_USER_FALLBACK
        value: "true"
      - key: ENABLE_WEB_SEARCH
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: RUNWAYML_API_SECRET
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: LICENSED_MUSIC_URL
        sync: false
      - key: LICENSED_MUSIC_LICENSE
        sync: false
      - key: OBJECT_STORAGE_UPLOAD_URL
        sync: false
      - key: CDN_PUBLIC_URL_TEMPLATE
        sync: false
      - key: VIDEO_PROVIDER_COST_PER_SECOND_USD
        value: "0.12"
      - key: VIDEO_MAX_PROVIDER_COST_USD
        value: "8"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_BASIC
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_ELITE
        sync: false
